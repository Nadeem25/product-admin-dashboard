name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - run: npm install
      - run: npm run orval
      - run: npm run lint


  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - run: npm install
      - run: npm run orval
      - run: npx playwright install --with-deps
      - run: npm run test:e2e